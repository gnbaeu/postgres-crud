<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540"><symbol id="landscape" viewBox="0 0 600 540"><style>.jm-moon{animation-play-state:var(--japan-animation-state,running);animation:jm-moon-breathe 6s ease-in-out infinite;filter:drop-shadow(0 0 4px #a5b4c020)}.jm-waves{animation-play-state:var(--japan-animation-state,running);animation:jm-wave-drift 12s ease-in-out infinite;transform-origin:center}.jm-moon,.jm-waves{animation-play-state:var(--japan-animation-state,running)}@keyframes jm-moon-breathe{0%,100%{opacity:.82}50%{opacity:.88}}@keyframes jm-wave-drift{0%,100%{transform:translateX(-2px);opacity:.9}50%{transform:translateX(2px);opacity:1}}@media(prefers-reduced-motion:reduce){.jm-moon,.jm-waves{animation:none}}</style><defs><linearGradient id="mount" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".7"/><stop offset="1" stop-color="currentColor" stop-opacity=".12"/></linearGradient></defs><circle class="jm-moon" cx="378" cy="125" r="64" fill="var(--jm-sun,#D9364F)" opacity=".85"/><g fill="none" stroke="currentColor" opacity=".12"><circle cx="378" cy="125" r="82"/><circle cx="378" cy="125" r="101"/><g class="jm-waves"><path d="M30 410Q150 380 270 410T570 410M30 430Q150 400 270 430T570 430M30 450Q150 420 270 450T570 450"/></g></g><path d="M25 385 285 135 568 385Z" fill="url(#mount)"/><path d="m233 185 52-50 58 51-31-10-25 17-27-18Z" fill="var(--color-text,#F5F1EA)" opacity=".8"/><path d="M0 400Q130 319 260 382T600 365V490H0Z" fill="currentColor" opacity=".18"/><g fill="var(--color-accent,#D9364F)"><path d="M365 280q80 15 160 0v14q-80 18-160 0ZM379 308h131v10H379zM392 292h11v89h-11zM485 292h11v89h-11z"/><path d="M385 381h25v5h-25zm93 0h25v5h-25z"/></g><g fill="var(--jm-petal,#F2B7C6)" opacity=".6"><ellipse cx="92" cy="175" rx="4" ry="9" transform="rotate(35 92 175)"/><ellipse cx="135" cy="228" rx="3" ry="7" transform="rotate(-25 135 228)"/><ellipse cx="498" cy="185" rx="3" ry="7"/></g></symbol></svg>