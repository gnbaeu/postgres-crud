name: gnwaa-laravel-local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gnwaa_laravel_dev
      POSTGRES_USER: gnwaa_migration
      POSTGRES_PASSWORD: ${GNWAA_LOCAL_POSTGRES_ADMIN_PASSWORD:?Set a fresh local database admin password}
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - laravel_pg:/var/lib/postgresql/data
      - ./docker/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnwaa_migration -d gnwaa_laravel_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    ports: ["127.0.0.1:3002:3002"]
    environment:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: ${GNWAA_LARAVEL_APP_KEY:?Set a fresh local GNWAA_LARAVEL_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: gnwaa_laravel_dev
      DB_USERNAME: gnwaa_app_runtime
      DB_PASSWORD: ${GNWAA_LOCAL_POSTGRES_APP_PASSWORD:?Set a fresh local runtime password}
      SESSION_DRIVER: database
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5175,http://127.0.0.1:5176
    depends_on:
      db: {condition: service_healthy}
volumes:
  laravel_pg:
